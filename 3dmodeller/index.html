<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Modeller</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101318;
      color: #d9e1ea;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #viewport {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    #webgl-error {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #101318;
    }
  </style>
  <script defer src="./main.js"></script>
</head>
<body>
  <canvas id="viewport"></canvas>
  <noscript>
    <div id="webgl-error">JavaScript is required to run the modeller.</div>
  </noscript>
</body>
</html>
